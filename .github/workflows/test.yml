name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The bundle has no dependencies, so nothing to install: the drift test
      # compares client.js against client.body.js and covers the build output.
      - run: node --check client.js
      - run: npm test
      - name: rebuild and confirm the committed bundle is current
        run: npm run build && git diff --exit-code -- client.js
